name = "ostoa-api"
main = "src/index.ts"
compatibility_date = "2026-05-12"

routes = [
  { pattern = "api.ostoa.org", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "ostoa"
database_id = "afee03da-8eb8-49e0-977e-4fb549cff106"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "ostoa-assets"
preview_bucket_name = "ostoa-assets-preview"

[vars]
CORS_ORIGIN = "https://admin.ostoa.org,https://ostoa.org,https://www.ostoa.org,https://ostoa-web.pages.dev"
